<style>

ackground:var(--soft);color:var(--accent);font-weight:bold}.content{padding:16px;min-height:680px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.head h2{margin:0;font-size:20px}.panel{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.tile{min-height:100px;text-align:right;padding:14px}.tile b{display:block;margin:7px 0}.row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:120px}.field label{font-size:12px;color:var(--muted)}input,select,textarea{min-width:0;width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:8px;border-radius:8px}textarea{min-height:75px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:9px;margin-top:10px}table{border-collapse:collapse;width:100%;min-width:680px;font-size:12px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{background:var(--soft)}td input{min-width:70px}.notice{background:var(--soft);padding:10px;border-radius:9px;font-size:12px;margin:9px 0}.hide{display:none!important}.months{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.months button.active,.tabs button.active{border-color:var(--accent);background:var(--soft);color:var(--accent)}.paper{background:linear-gradient(180deg,#f5f9ff 0,#fff 145px);color:#24364b;padding:28px;min-height:600px;border:1px solid #b8cde2;border-top:8px solid #1769aa;border-radius:5px;max-width:850px;margin:14px auto;box-shadow:0 5px 22px #173b5b20;font:14px Arial,Tahoma,sans-serif;position:relative}.paper h2{color:#174f7d;border-bottom:2px solid #d4e5f4;padding:12px 0}.paper table th{background:#e1edf8;color:#174f7d;border-bottom:2px solid #7da8cf}.paper table td{border-bottom:1px solid #d9e5ef}.paper .docbrand{background:linear-gradient(100deg,#174f7d,#2e8 </style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">📊</div><div><h1>مساعدي المحاسبي</h1><small>دحماني خالد بن الوليد · إصدار مطوّر</small></div></div><div class="tools no-print"><select id="lang" class="tiny"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select><button id="mode" class="tiny">🎓 وضع التعلم</button><button id="calcToggle" class="tiny">🧮 الحاسبة</button><button id="print" class="tiny">🖨️ طباعة</button><div class="datebox">📅 <span id="date"></span> · <b id="clock"></b></div></div></header><section class="hero"><div><h2>مرحباً بك في مساعدي المحاسبي</h2><div>فضاء محاسبي وإداري للتعلم والتطبيق العملي</div></div><span>🔒 حفظ محلي</span></section><div class="layout"><aside class="sidebar no-print" id="nav"></aside><main class="content" id="view"></main></div><div class="footer">إصدار مطوّر · البيانات محفوظة محلياً في هذا المتصفح · صدّر نسخة احتياطية دورياً</div></div><div id="calc" class="calc hide no-print"><div class="row" style="justify-content:space-between"><b>آلة حاسبة</b><button id="calcClose">×</button></div><input id="calcDisplay" value="0" readonly><div class="calcgrid" id="calcKeys"></div><div class="muted" id="calcHistory"></div></div>
<script>

let db={...defaults};try{db={...defaults,...JSON.parse(localStorage.getItem('ma5_data')||'{}')}}catch{}
function save(){localStorage.setItem('ma5_data',JSON.stringify(db))}document.documentElement.dataset.theme=theme;
const labels={home:'🏠 الرئيسية',journal:'📒 اليومية',scf:'🧾 SCF الحسابات',excel:'▦ Excel (إكسال)',word:'📝 مذكرتي',stock:'📦 المخزون والإنتاج',docs:'📄 المستندات',tax:'🗓️ الضرائب',hr:'👥 الموارد البشرية',partners:'🤝 الزبائن والموردون',learn:'🎓 مركز التعلم',years:'📅 السنوات المالية',settings:'⚙️ الإعدادات'};const sections=Object.keys(labels);
function clock(){let d=new Date();$('#date').textContent=new Intl.DateTimeFormat(lang==='ar'?'ar-DZ':lang==='fr'?'fr-DZ':'en-GB',{weekday:'long',day:'2-digit',month:'long',year:'numeric',timeZone:'Africa/Algiers'}).format(d);$('#clock').textContent=new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:'Africa/Algiers'}).format(d)}setInterval(clock,1000);clock();$('#lang').value=lang;$('#lang').onchange=e=>{lang=e.target.value;localStorage.setItem('ma5_lang',lang);clock();render()};$('#mode').textContent=mode==='learn'?'🎓 وضع التعلم':'💼 وضع العمل';$('#mode').onclick=()=>{mode=mode==='learn'?'work':'learn';localStorage.setItem('ma5_mode',mode);$('#mode').textContent=mode==='learn'?'🎓 وضع التعلم':'💼 وضع العمل';render()};$('#print').onclick=()=>print();
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dl(name,content,type='text/plain'){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function shell(title,body,sub=''){ $('#view').innerHTML=`<div class="head"><div><h2>${title}</h2><div class="muted">${sub}</div></div><span class="pill">${mode==='learn'?'وضع التعلم':'وضع العمل'}</span></div>${body}`;}
function nav(){let n=$('#nav');n.innerHTML='';sections.forEach(k=>{let b=document.createElement('button');b.className='navbtn '+(active===k?'active':'');b.textContent=labels[k];b.onclick=()=>{active=k;render()};n.append(b)})}function opt(a){return a.map(x=>`<option>${esc(x)}</option>`).join('')}function help(t){return mode==='learn'?`<div class="notice">💡 ${t}</div>`:''}
function home(){shell('لوحة القيادة',`${help('ابدأ من القسم المناسب. في وضع التعلم تظهر شروحات مختصرة، وفي وضع العمل تختفي الشروحات.') }<div class="grid">${sections.slice(1).map(k=>`<button class="tile" data-go="${k}"><span style="font-size:24px">${labels[k].split(' ')[0]}</span><b>${labels[k].slice(labels[k].indexOf(' ')+1)}</b><small class="muted">فتح القسم</small></button>`).join('')}</div><div class="panel"><b>ملخص النشاط</b><div class="grid"><div>قيود اليومية <h2>${db.journal.length}</h2></div><div>حسابات SCF <h2>${db.accounts.length}</h2></div><div>الأصناف <h2>${db.products.length}</h2></div><div>العمال <h2>${db.employees.length}</h2></div><div>المستندات <h2>${db.docs.length}</h2></div><div>الشركاء <h2>${db.partners.length}</h2></div></div></div><div class="panel"><b>السنة المالية النشطة:</b> ${esc(db.activeYear)}</div>`);document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{active=b.dataset.go;render()})}
function journal(){

 $('#add').onclick=()=>$('#form').classList.toggle('hide');$('#cancelj').onclick=()=>$('#form').classList.add('hide');
 $('#savej').onclick=()=>{let r={date:$('#j_date').value||today(),debitAcc:$('#j_debitAcc').value,creditAcc:$('#j_creditAcc').value,debit:+$('#j_debit').value||0,credit:+$('#j_credit').value||0,desc:$('#j_desc').value.trim(),note:$('#j_note').value.trim()};if(!r.debitAcc||!r.creditAcc||r.debit<=0||r.credit<=0||Math.abs(r.debit-r.credit)>.005||!r.desc)return alert('اختر حسابي المدين والدائن، وأدخل مبلغين متساويين وبياناً للعملية');db.journal.push(r);save();journal()};
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('هل تريد حذف هذا السطر؟')){db.journal.splice(+b.dataset.del,1);save();journal()}});

}

function scf(){if(!db.accounts.length)db.accounts=scfSeed.map(a=>({code:a[0],ar:a[1],fr:a[2],en:a[2],custom:false}));save();shell('SCF – دليل الحسابات',`${help('الإطار الإلزامي للحسابات ذات رقمين مستند إلى الجريدة الرسمية رقم 19 لسنة 2009. يمكن إضافة التفريعات الداخلية الخاصة بمؤسستك. أسماء العربية ترجمة مساعدة؛ المرجع القانوني الفرنسي.') }<div class="row"><div class="field"><label>بحث بالرمز أو الاسم</label><input id="sq" placeholder="مثال: 401 أو الموردون"></div><div class="field"><label>الفئة</label><select id="sclass"><option value="">كل الفئات</option>${[1,2,3,4,5,6,7].map(x=>`<option value="${x}">الفئة ${x}</option>`).join('')}</select></div><button class="primary" id="addAcc">＋ إضافة حساب</button><button id="seedAcc">إعادة تحميل الحسابات الأساسية</button></div><div id="accForm" class="panel hide"><div class="row">${[['code','رقم الحساب'],['ar','الاسم بالعربية'],['fr','Nom français'],['en','English name']].map(([i,l])=>`<div class="field"><label>${l}</label><input id="a_${i}"></div>`).join('')}</div><button class="primary" id="saveAcc">حفظ الحساب</button><button id="cancelAcc">إلغاء</button></div><div class="tablewrap"><table><thead><tr><th>الرمز</th><th>الحساب بالعربية</th><th>Français</th><th>English</th><th>النوع</th><th>إجراءات</th></tr></thead><tbody id="accRows"></tbody></table></div><div class="muted">المصدر: <a target="_blank" href="https://www.joradp.dz/FTP/JO-FRANCAIS/2009/F2009019.pdf">الجريدة الرسمية رقم 19 – 25 مارس 2009</a>. هذا إطار الحسابات الرئيسية وليس تفريعاً كاملاً لكل الحسابات الفرعية.</div>`);function list(){let q=$('#sq').value.toLowerCase(),c=$('#sclass').value;$('#accRows').innerHTML=db.accounts.filter(a=>(!c||a.code.startsWith(c))&&(!q||(a.code+' '+a.ar+' '+a.fr+' '+a.en).toLowerCase().includes(q))).sort((a,b)=>a.code.localeCompare(b.code,undefined,{numeric:true})).map(a=>`<tr><td>${esc(a.code)}</td><td>${esc(a.ar)}</td><td>${esc(a.fr)}</td><td>${esc(a.en)}</td><td>${a.custom?'مضاف':'أساسي'}</td><td><button data-editacc="${esc(a.code) function excel(){let si=0;function formula(v){try{if(!String(v).startsWith('='))return v;let exp=String(v).slice(1).replace(/([A-Z]+\d+):([A-Z]+\d+)/g,(_,a,b)=>{let ar=cellRange(a,b);return JSON.stringify(ar)}).replace(/([A-Z]+\d+)/g,(_,r)=>JSON.stringify(getCell(r)));let m=exp.match(/^([A-Z]+)\((.*)\)$/i);if(m){let args=JSON.parse('['+m[2].replace(/,(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)/g,',')+']');let f=funcs[m[1].toUpperCase()];return f?f(args):'#NAME?'}return Function('return ('+exp+')')()}catch{return '#VALUE!'}}function col(n){let s='';while(n){let r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26)}return s}function cellRange(a,b){let parse=x=>{let m=x.match(/([A-Z]+)(\d+)/);let c=0;for(let z of m[1])c=c*26+z.charCodeAt(0)-64;return [c,+m[2]]},p=parse(a),q=parse(b),out=[];for(let y=p[1];y<=q[1];y++)for(let x=p[0];x<=q[0];x++)out.push(getCell(col(y)+x));return out}function getCell(r){return db.sheets[si].cells[r]||''}function renderGrid(){let s=db.sheets[si],html='<table><thead><tr><th></th>'+Array.from({length:10},(_,i)=>`<th>${col(i+1)}</th>`).join('')+'</tr></thead><tbody>';for(let r=1;r<=25;r++){html+=`<tr><th>${r}</th>`;for(let c=1;c<=10;c++){let id=col(c)+r,v=s.cells[id]||'';html+=`<td><input data-cell="${id}" value="${esc(v)}" aria-label="${id}" style="min-width:90px"></td>`}html+='</tr>'}html+='</tbody></table>';$('#sheetGrid').innerHTML=html;document.querySelectorAll('[data-cell]').forEach(i=>i.onchange=()=>{s.cells[i.dataset.cell]=i.value;save()})}shell('Excel – الجداول الحسابية',`${help('اكتب القيم أو الصيغ مثل =SUM(A1:A5)، =AVERAGE(B1:B5)، =IF(A1>0,1,0)، =SUMIF(A1:A5,"أجور",B1:B5). الصيغ تدعم مجموعة أساسية من الدوال.') }<div class="row"><div class="field"><label>ورقة العمل</label><select id="sheet">${db.sheets.map((s,i)=>`<option value="${i}">${esc(s.name)}</option>`).join('')}</select></div><button id="newSheet">＋ ورقة</button><button id="renameSheet">تسمية</button><button id="deleteSheet" class="danger">حذف ورقة</button><button id="csvShee "number" value="9" step=".01"></div><div class="field"><label>IRG (مبلغ يحدد بعد التحقق)</label><input id="irg" type="number" value="0"></div><button id="calcPay" class="primary">حساب وحفظ الأجر</button></div><div id="payresult" class="panel"></div><div class="tablewrap"><table><tr><th>الشهر</th><th>العامل</th><th>خام</th><th>CNAS</th><th>IRG</th><th>الصافي</th><th>إجراء</th></tr>${db.payroll.map((p,i)=>`<tr><td>${p.month}</td><td>${esc(p.name)}</td><td>${p.gross.toFixed(2)}</td><td>${p.cnas.toFixed(2)}</td><td>${p.irg.toFixed(2)}</td><td>${p.net.toFixed(2)}</td><td><button data-payslip="${i}">كشف</button></td></tr>`).join('')}</table></div>`;if(t==='attendance')v.innerHTML=`<div class="row"><div class="field"><label>العامل</label><select id="attEmp">${db.employees.map(e=>`<option value="${e.code}">${esc(e.name)}</option>`).join('')}</select></div><div class="field"><label>التاريخ</label><input id="attDate" type="date" value="${today()}"></div><div class="field"><label>الحالة</label><select id="attStatus">${opt(['حاضر','غياب مبرر','غياب غير مبرر','عطلة','مرضية'])}</select></div><button id="attAdd" class="primary">تسجيل</button></div><div id="attList">${(db.attendance||[]).map(a=>`<div class="panel">${a.date} · ${esc(a.name)} · ${a.status}</div>`).join('')}</div>`;if(t==='pay'){ $('#calcPay').onclick=()=>{let e=db.employees.find(x=>x.code===$('#payemp').value);if(!e)return alert('أضف عاملاً أولاً');let base=+$('#base').value||0,bonus=+$('#bonus').value||0,ot=+$('#overtime').value||0,gross=base+bonus+ot,cnas=gross*(+$('#cnasrate').value||0)/100,irg=+$('#irg').value||0,other=+$('#otherded').value||0,net=gross-cnas-irg-other;if(net<0)return alert('الاقتطاعات تتجاوز الأجر الخام');let p={month:$('#paymonth').value,code:e.code,name:e.name,base,bonus,ot,gross,cnas,irg,other,net};db.payroll.push(p);save();$('#payresult').innerHTML=`<h3>كشف راتب تعليمي – ${esc(e.name)}</h3><p>الأجر الخام: ${gross.toFixed(2)} دج</p><p>CNAS: ${cnas.toFixed(2)} دج · IRG: ${irg.toFixed(2)} دج · اقتطاعات أخرى: ${other.toFixed(2)} دج</p><h2>الصافي: ${net.toFixed(2)} دج</h2><button onclick="window.print()">طباعة</button>`;list('pay')};document.querySelectorAll('[data-payslip]').forEach(b=>b.onclick=()=>{let p=db.payroll[+b.dataset.payslip];$('#payresult').innerHTML=`<div class="paper"><h2>كشف الراتب / Bulletin de paie</h2><p>العامل: ${esc(p.name)} · الفترة: ${p.month}</p><p>الأجر الأساسي: ${p.base} · المنح: ${p.bonus} · الإضافي: ${p.ot}</p><p>الأجر الخام: ${p.gross}</p><p>CNAS: ${p.cnas} · IRG: ${p.irg} · اقتطاعات: ${p.other}</p><h2>الصافي للدفع: ${p.net.toFixed(2)} دج</h2></div>`})}if(t==='staff'){$('#eadd').onclick=()=>{let e={name:$('#ename').value.trim(),code:$('#ecode').value.trim(),post:$('#epost').value,date:$('#edate').value,contract:$('#econtract').value};if(!e.name||!e.code)return alert('الاسم ورقم العامل ضروريان');if(db.employees.some(x=>x.code===e.code))return alert('رقم العامل موجود');db.employees.push(e);save();list('staff')};document.querySelectorAll('[data-edel]').forEach(b=>b.onclick=()=>{let e=db.employees[+b.dataset.edel];if(db.payroll.some(p=>p.code===e.code))return alert('للعامل كشوف أجور محفوظة');db.employees.splice(+b.dataset.edel,1);save();list('staff')})}if(t==='attendance')$('#attAdd').onclick=()=>{let e=db.employees.find(x=>x.code===$('#attEmp').value);if(!e)return alert('أضف عاملاً');db.attendance=db.attendance||[];db.attendance.push({code:e.code,name:e.name,date:$('#attDate').value,status:$('#attStatus').value});save();list('attendance')}}shell('الموارد البشرية (RH)',`${help('أنشئ ملفات العمال، سجّل الحضور، وأعد حساباً أولياً للأجر. القواعد القانونية للأجر والاقتطاعات يجب تحديثها والتحقق منها قبل الاستخدام الرسمي.') }<div class="tabs">${[['staff','ملفات العمال'],['pay','الأجور وكشوف الراتب'],['attendance','الحضور والغياب']].map(([k,v])=>`<button data-hrtab="${k}">${v}</button>`).join('')}</div><div id="hrview"></div>`);document.querySelectorAll('[data-hrtab]').forEach(b=>b.onclick=()=>list(b.dataset.hrtab));list('staff')}

let calcExpr='';const keys=['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','%','+','C','⌫','(',')','=','00'];$('#calcKeys').innerHTML=keys.map(k=>`<button data-key="${k}" class="${k==='='?'primary':''}">${k}</button>`).join('');$('#calcToggle').onclick=()=>$('#calc').classList.toggle('hide');$('#calcClose').onclick=()=>$('#calc').classList.add('hide');document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{let k=b.dataset.key;if(k==='C')calcExpr='';else if(k==='⌫')calcExpr=calcExpr.slice(0,-1);else if(k==='='){try{let exp=calcExpr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');if(!/^[0-9+*/().\-\s]+$/.test(exp))throw 0;let result=Function('"use strict";return ('+exp+')')();if(!Number.isFinite(result))throw 0;$('#calcDisplay').value=result;$('#calcHistory').textContent=calcExpr+' = '+result;calcExpr=String(result);return}catch{$('#calcDisplay').value='خطأ';return}}else calcExpr+=k;$('#calcDisplay').value=calcExpr||'0'});
